name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build source/GameCollections.sln -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: pext
          path: dist/*.pext

      # Pushing a tag such as v1.0.1 publishes a GitHub release with the .pext attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pext
          generate_release_notes: true
