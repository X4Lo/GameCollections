name: Crowdin

# Uploads the English strings to Crowdin when they change, and opens a pull request with the latest translations.
on:
  push:
    branches: [master]
    paths:
      - source/GameCollections/Localization/en_US.xaml
      - crowdin.yml
  schedule:
    # Every Monday, so new translations arrive without a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin
          commit_message: 'chore: update translations from Crowdin'
          create_pull_request: true
          pull_request_title: 'Update translations from Crowdin'
          pull_request_body: 'New and updated translations from Crowdin.'
          pull_request_base_branch_name: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
